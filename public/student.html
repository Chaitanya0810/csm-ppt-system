<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPT Submission</title>
<style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;background:#f3f6fb;color:#172033;margin:0}.card{max-width:620px;margin:42px auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 6px 24px #17203312}h1{text-align:center;margin:4px}#className{text-align:center;color:#64748b;margin:8px 0 24px}label{display:block;font-weight:700;margin:16px 0 7px}select,input,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{margin-top:20px;border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}button:disabled{background:#94a3b8}#status{margin-top:16px;text-align:center;font-weight:700}.error{color:#b91c1c}.success{color:#15803d}.info{color:#2563eb}</style></head>
<body><main class="card"><h1>Submit your presentation</h1><div id="className">Loading class…</div>
<label for="roll">Roll number</label><select id="roll"><option value="">Select roll number</option></select>
<label for="category">Category</label><select id="category"><option value="">Select category</option></select>
<label for="subject">Subject</label><select id="subject" disabled><option value="">Select subject</option></select>
<label for="file">PowerPoint file</label><input id="file" type="file" accept=".ppt,.pptx">
<button id="submit">Upload PPT</button><div id="status"></div></main><script>
const slug=new URLSearchParams(location.search).get('class'),roll=document.getElementById('roll'),cat=document.getElementById('category'),sub=document.getElementById('subject'),status=document.getElementById('status');let cfg;
function message(s,c=''){status.className=c;status.textContent=s}
async function init(){if(!slug){message('This link is missing its class code. Ask your admin for the correct link.','error');return}try{const r=await fetch(`/api/class/${encodeURIComponent(slug)}`),d=await r.json();if(!r.ok)throw new Error(d.error);cfg=d;document.getElementById('className').textContent=d.name;d.rolls.forEach(v=>roll.add(new Option(v,v)));Object.keys(d.structure).forEach(v=>cat.add(new Option(v,v)))}catch(e){document.getElementById('className').textContent='';message(e.message,'error')}}
cat.onchange=()=>{sub.innerHTML='<option value="">Select subject</option>';sub.disabled=!cat.value;(cfg?.structure[cat.value]||[]).forEach(v=>sub.add(new Option(v,v)))};
document.getElementById('submit').onclick=()=>{const file=document.getElementById('file').files[0];if(!roll.value||!cat.value||!sub.value||!file)return message('Select roll number, category, subject and a file.','error');if(!/\.(ppt|pptx)$/i.test(file.name))return message('Only PPT and PPTX files are allowed.','error');const data=new FormData();data.append('classSlug',slug);data.append('roll',roll.value);data.append('category',cat.value);data.append('subject',sub.value);data.append('file',file);const b=document.getElementById('submit'),xhr=new XMLHttpRequest();b.disabled=true;message('Uploading…','info');xhr.open('POST','/api/upload');xhr.upload.onprogress=e=>{if(e.lengthComputable)message(`Uploading… ${Math.round(e.loaded/e.total*100)}%`,'info')};xhr.onload=()=>{b.disabled=false;let d={};try{d=JSON.parse(xhr.responseText)}catch{}if(xhr.status>=200&&xhr.status<300){message('Upload complete.','success');document.getElementById('file').value=''}else message(d.error||'Upload failed.','error')};xhr.onerror=()=>{b.disabled=false;message('Network error during upload.','error')};xhr.send(data)};
init();
</script></body></html>
