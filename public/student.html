<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PPT Submission</title>
  <link rel="stylesheet" href="/student.css?v=7">
  <link rel="stylesheet" href="/theme-variants.css?v=7">
  <script src="/theme-preview.js?v=6"></script>
  <script src="/student.js?v=6" defer></script>
</head>
<body>
  <main class="card">
    <header class="card-header">
      <div class="presentation-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="5" y="5" width="22" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M16 21v6m-5 0h10M10 15l4-4 4 4 4-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>Submit your PPT</h1>
      <p id="className">Loading class…</p>
    </header>
    <div id="preview" class="preview" hidden>Preview only · Uploads disabled</div>
    <form id="submissionForm">
      <fieldset id="fields" disabled>
        <label for="roll"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg>Roll number</label>
        <select id="roll" required><option value="">Select roll number</option></select>
        <label for="category"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Category</label>
        <select id="category" required><option value="">Select category</option></select>
        <label for="subject"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/></svg>Subject</label>
        <select id="subject" required disabled><option value="">Select subject</option></select>
        <section id="projectTeam" class="team-section" hidden aria-label="Project team">
          <label for="teamSize">Team size (including you)</label>
          <select id="teamSize" disabled><option value="">Select team size</option><option value="3">3 members</option><option value="4">4 members</option></select>
          <div id="teammates"></div>
        </section>
        <label for="file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8Zm0 0v5h5M8 13h8m-8 4h5"/></svg>PPT file</label>
        <input id="file" type="file" accept=".ppt,.pptx" required>
        <button id="submit" type="submit">Upload PPT</button>
      </fieldset>
      <progress id="progress" max="100" value="0" hidden aria-label="Upload progress"></progress>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <nav class="page-nav" aria-label="Page navigation"><a id="submissionsLink" href="/dashboard.html">View Submissions</a><a id="adminLink" href="/admin-login.html">Admin</a></nav>
  </main>
  <footer class="creator-credit">Created by Ch.Chaitanya</footer>
</body>
</html>
