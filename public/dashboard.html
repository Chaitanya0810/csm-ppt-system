<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSM PPT Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

.header {
    background: white;
    padding: 20px 30px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.header h1 {
    margin: 0;
}

.controls {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 20px;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

select {
    padding: 13px;

    border: 1px solid #d1d5db;
    border-radius: 9px;

    background: white;

    font-size: 15px;
}

select:disabled {
    background: #f3f4f6;
    cursor: not-allowed;
}

.container {
    max-width: 1200px;
    margin: auto;

    padding: 0 20px 40px;
}

.info {
    margin-bottom: 20px;
    color: #6b7280;
}

.grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(280px, 1fr));

    gap: 18px;
}

.card {
    background: white;

    border-radius: 14px;

    padding: 20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.07);
}

.roll {
    font-size: 18px;
    font-weight: bold;

    margin-bottom: 10px;
}

.filename {
    font-size: 13px;

    color: #6b7280;

    word-break: break-word;

    min-height: 40px;
}

.open {
    display: block;

    margin-top: 15px;

    padding: 11px;

    text-align: center;

    background: #2563eb;

    color: white;

    text-decoration: none;

    border-radius: 8px;

    transition: 0.2s;
}

.open:hover {
    background: #1d4ed8;
}

.empty {
    background: white;

    padding: 40px;

    text-align: center;

    border-radius: 14px;

    color: #6b7280;
}

.loading {
    text-align: center;

    padding: 40px;
}

.error {
    background: #fee2e2;

    color: #991b1b;

    padding: 20px;

    border-radius: 10px;

    text-align: center;
}

@media(max-width:650px) {

    .controls {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

    <h1>CSM PPT Dashboard</h1>

</div>


<!-- CONTROLS -->

<div class="controls">

    <select id="category">

        <option value="">
            Select Type
        </option>

        <option value="Lab">
            Lab
        </option>

        <option value="Theory">
            Theory
        </option>

        <option value="Project">
            Project
        </option>

    </select>


    <select id="subject" disabled>

        <option value="">
            Select Subject
        </option>

    </select>

</div>


<!-- CONTENT -->

<div class="container">

    <div id="info" class="info">
        Select type and subject.
    </div>


    <div id="content">

        <div class="empty">
            No presentation selected.
        </div>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const categorySelect =
    document.getElementById("category");

const subjectSelect =
    document.getElementById("subject");

const info =
    document.getElementById("info");

const content =
    document.getElementById("content");


/* =========================================================
   DATA
========================================================= */

let structure = {};


/* =========================================================
   LOAD CONFIGURATION
========================================================= */

async function loadConfig() {

    try {

        const response =
            await fetch("/api/config");

        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }

        const data =
            await response.json();

        if (!data.ok) {

            throw new Error(
                data.error ||
                "Unable to load configuration."
            );

        }

        structure =
            data.structure || {};

    }

    catch (error) {

        console.error(
            "CONFIG ERROR:",
            error
        );

        content.innerHTML = `
            <div class="error">
                Unable to load configuration.
                <br>
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* =========================================================
   CATEGORY CHANGE
========================================================= */

categorySelect.addEventListener(
    "change",
    function () {

        subjectSelect.innerHTML =
            `
            <option value="">
                Select Subject
            </option>
            `;

        content.innerHTML =
            `
            <div class="empty">
                Select a subject.
            </div>
            `;

        info.textContent =
            "Select a subject.";

        subjectSelect.disabled =
            !this.value;


        if (!this.value) {

            return;

        }


        const subjects =
            structure[this.value];


        if (
            !subjects ||
            !Array.isArray(subjects)
        ) {

            content.innerHTML =
                `
                <div class="error">
                    No subjects found.
                </div>
                `;

            return;

        }


        subjects.forEach(
            function (subject) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    subject;

                option.textContent =
                    subject;

                subjectSelect.appendChild(
                    option
                );

            }
        );

    }
);


/* =========================================================
   SUBJECT CHANGE
========================================================= */

subjectSelect.addEventListener(
    "change",
    loadPPTs
);


/* =========================================================
   LOAD PRESENTATIONS
========================================================= */

async function loadPPTs() {

    const category =
        categorySelect.value;

    const subject =
        subjectSelect.value;


    if (
        !category ||
        !subject
    ) {

        return;

    }


    content.innerHTML =
        `
        <div class="loading">
            Loading presentations...
        </div>
        `;


    try {

        const url =
            `/api/ppts?category=${encodeURIComponent(category)}&subject=${encodeURIComponent(subject)}`;


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const data =
            await response.json();


        if (!data.ok) {

            throw new Error(
                data.error ||
                "Unable to load presentations."
            );

        }


        info.textContent =
            `${subject} • ${category} • ${data.count}/${data.totalStudents} submitted`;


        if (
            !data.submissions ||
            data.submissions.length === 0
        ) {

            content.innerHTML =
                `
                <div class="empty">
                    No PPTs submitted yet.
                </div>
                `;

            return;

        }


        const grid =
            document.createElement(
                "div"
            );

        grid.className =
            "grid";


        data.submissions.forEach(
            function (item) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "card";


                /*
                   IMPORTANT FIX:

                   Server returns:
                   item.presentationUrl

                   NOT:
                   item.url
                */

                const presentationUrl =
                    item.presentationUrl ||
                    item.driveUrl ||
                    "#";


                card.innerHTML = `

                    <div class="roll">
                        ${escapeHTML(item.roll)}
                    </div>

                    <div class="filename">
                        ${escapeHTML(item.fileName)}
                    </div>

                    ${
                        presentationUrl !== "#"
                        ?

                        `
                        <a
                            class="open"
                            href="${escapeAttribute(presentationUrl)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Open Presentation
                        </a>
                        `

                        :

                        `
                        <div class="error">
                            Presentation link unavailable.
                        </div>
                        `
                    }

                `;


                grid.appendChild(
                    card
                );

            }
        );


        content.innerHTML =
            "";

        content.appendChild(
            grid
        );

    }

    catch (error) {

        console.error(
            "PPT LOAD ERROR:",
            error
        );


        content.innerHTML =
            `
            <div class="error">
                Unable to load presentations.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
            `;

    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ATTRIBUTE ESCAPE
========================================================= */

function escapeAttribute(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================================
   INITIALIZE
========================================================= */

loadConfig();

</script>

</body>

</html>
