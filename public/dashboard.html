<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSM PPT Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
        }

        body {
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background: linear-gradient(
                135deg,
                #1d4ed8,
                #2563eb,
                #3b82f6
            );

            color: white;
            padding: 24px 5%;

            box-shadow:
                0 5px 20px rgba(37, 99, 235, 0.18);
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        .brand h1 {
            font-size: 27px;
            margin-bottom: 5px;
        }

        .brand p {
            opacity: 0.85;
            font-size: 14px;
        }

        .refresh-btn {
            border: 1px solid rgba(255,255,255,0.35);

            background: rgba(255,255,255,0.15);

            color: white;

            padding: 11px 18px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(255,255,255,0.25);
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            max-width: 1400px;
            margin: 30px auto;

            padding: 0 20px;
        }


        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 15px;

            padding: 22px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.04);
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;

            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
        }


        /* =========================
           FILTER PANEL
        ========================= */

        .filter-card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 22px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.04);
        }

        .filter-title {
            font-size: 17px;
            font-weight: bold;

            margin-bottom: 17px;
        }

        .filters {
            display: grid;

            grid-template-columns:
                1.5fr
                1fr
                1fr
                1fr
                auto;

            gap: 12px;
        }

        .input,
        .select {
            width: 100%;

            padding: 12px 13px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: white;

            color: var(--text);

            font-size: 14px;
        }

        .input:focus,
        .select:focus {
            outline: none;

            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,0.10);
        }

        .clear-btn {
            padding: 12px 17px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            cursor: pointer;

            font-weight: bold;
        }

        .clear-btn:hover {
            background: #374151;
        }


        /* =========================
           TABLE
        ========================= */

        .content-card {
            background: white;

            border:
                1px solid var(--border);

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.04);
        }

        .content-header {
            padding: 20px 22px;

            border-bottom:
                1px solid var(--border);

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .content-header h2 {
            font-size: 18px;
        }

        .result-count {
            color: var(--muted);

            font-size: 13px;
        }

        .table-wrapper {
            width: 100%;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 850px;
        }

        th {
            text-align: left;

            padding: 14px 18px;

            background: #f9fafb;

            color: #6b7280;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 0.04em;
        }

        td {
            padding: 16px 18px;

            border-top:
                1px solid #f0f1f3;

            font-size: 14px;
        }

        tr:hover td {
            background: #fafcff;
        }


        /* =========================
           BADGES
        ========================= */

        .badge {
            display: inline-block;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }

        .badge-lab {
            background: #eff6ff;
            color: #2563eb;
        }

        .badge-theory {
            background: #f5f3ff;
            color: #7c3aed;
        }

        .badge-project {
            background: #ecfdf5;
            color: #059669;
        }


        /* =========================
           FILE LINK
        ========================= */

        .file-link {
            color: var(--primary);

            text-decoration: none;

            font-weight: 600;
        }

        .file-link:hover {
            text-decoration: underline;
        }


        /* =========================
           EMPTY / LOADING
        ========================= */

        .message {
            padding: 55px 20px;

            text-align: center;

            color: var(--muted);
        }

        .loading {
            color: var(--primary);

            font-weight: bold;
        }

        .error {
            color: var(--danger);

            font-weight: bold;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1000px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .filters {
                grid-template-columns:
                    1fr 1fr;
            }

            .clear-btn {
                width: 100%;
            }

        }


        @media (max-width: 650px) {

            .header {
                padding: 20px;
            }

            .header-inner {
                align-items: flex-start;

                flex-direction: column;
            }

            .main {
                margin-top: 20px;

                padding: 0 12px;
            }

            .stats {
                grid-template-columns:
                    1fr;
            }

            .filters {
                grid-template-columns:
                    1fr;
            }

            .filter-card,
            .content-card {
                border-radius: 12px;
            }

        }

    </style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <h1>
                CSM PPT Dashboard
            </h1>

            <p>
                Presentation submission management system
            </p>

        </div>


        <button
            class="refresh-btn"
            id="refreshBtn"
        >
            ↻ Refresh
        </button>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">


    <!-- =========================
         STATISTICS
    ========================= -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-label">
                Total Presentations
            </div>

            <div
                class="stat-value"
                id="totalCount"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Lab
            </div>

            <div
                class="stat-value"
                id="labCount"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Theory
            </div>

            <div
                class="stat-value"
                id="theoryCount"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Projects
            </div>

            <div
                class="stat-value"
                id="projectCount"
            >
                0
            </div>

        </div>

    </section>



    <!-- =========================
         FILTERS
    ========================= -->

    <section class="filter-card">

        <div class="filter-title">
            Filter Presentations
        </div>


        <div class="filters">


            <!-- SEARCH -->

            <input
                type="text"
                id="searchInput"
                class="input"
                placeholder="Search roll number or file name..."
            >


            <!-- TYPE -->

            <select
                id="typeFilter"
                class="select"
            >

                <option value="">
                    All Types
                </option>

                <option value="Lab">
                    Lab
                </option>

                <option value="Theory">
                    Theory
                </option>

                <option value="Project">
                    Project
                </option>

            </select>


            <!-- SUBJECT -->

            <select
                id="subjectFilter"
                class="select"
            >

                <option value="">
                    All Subjects
                </option>

            </select>


            <!-- ROLL -->

            <select
                id="rollFilter"
                class="select"
            >

                <option value="">
                    All Roll Numbers
                </option>

            </select>


            <!-- CLEAR -->

            <button
                class="clear-btn"
                id="clearBtn"
            >
                Clear
            </button>

        </div>

    </section>



    <!-- =========================
         CONTENT
    ========================= -->

    <section class="content-card">


        <div class="content-header">

            <h2>
                Submitted Presentations
            </h2>

            <span
                class="result-count"
                id="resultCount"
            >
                0 results
            </span>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Roll Number
                        </th>

                        <th>
                            Type
                        </th>

                        <th>
                            Subject
                        </th>

                        <th>
                            File
                        </th>

                        <th>
                            Date
                        </th>

                    </tr>

                </thead>


                <tbody id="tableBody">

                    <tr>

                        <td colspan="5">

                            <div class="message loading">
                                Loading presentations...
                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>



<script>

/* =========================================================
   DATA
========================================================= */

let presentations = [];


/* =========================================================
   SUBJECT STRUCTURE
========================================================= */

const SUBJECTS = {

    Lab: [
        "Node-JS",
        "CM",
        "JAVA",
        "DBMS",
        "SE",
        "GS"
    ],

    Theory: [
        "MSF",
        "JAVA",
        "COA",
        "DBMS",
        "SE"
    ],

    Project: [
        "Node-JS",
        "CM",
        "JAVA",
        "DBMS",
        "SE"
    ]

};


/* =========================================================
   ROLL NUMBERS
========================================================= */

const ROLLS = [

    "257R1A66C9",

    "257R1A66D0",
    "257R1A66D1",
    "257R1A66D2",
    "257R1A66D3",
    "257R1A66D4",
    "257R1A66D5",
    "257R1A66D6",
    "257R1A66D7",
    "257R1A66D8",
    "257R1A66D9",

    "257R1A66E0",
    "257R1A66E1",
    "257R1A66E2",
    "257R1A66E3",
    "257R1A66E4",
    "257R1A66E5",
    "257R1A66E6",
    "257R1A66E7",
    "257R1A66E8",
    "257R1A66E9",

    "257R1A66F0",
    "257R1A66F1",
    "257R1A66F2",
    "257R1A66F3",
    "257R1A66F4",
    "257R1A66F5",
    "257R1A66F6",
    "257R1A66F7",
    "257R1A66F8",
    "257R1A66F9",

    "257R1A66G0",
    "257R1A66G1",
    "257R1A66G2",
    "257R1A66G3",
    "257R1A66G4",
    "257R1A66G5",
    "257R1A66G6",
    "257R1A66G7",
    "257R1A66G8",
    "257R1A66G9",

    "257R1A66H0",
    "257R1A66H1",
    "257R1A66H2",
    "257R1A66H3",
    "257R1A66H4",
    "257R1A66H5",
    "257R1A66H6",
    "257R1A66H7",
    "257R1A66H8",
    "257R1A66H9",

    "257R1A66J0",
    "257R1A66J1",
    "257R1A66J3",
    "257R1A66J4",
    "257R1A66J6",
    "257R1A66J7",
    "257R1A66J8",
    "257R1A66J9",

    "257R1A66K0",
    "257R1A66K1",
    "257R1A66K2",

    "267R5A6615",
    "267R5A6616",
    "267R5A6617",
    "267R5A6618",
    "267R5A6619",
    "267R5A6620",
    "267R5A6621",
    "267R5A6622"

];


/* =========================================================
   ELEMENTS
========================================================= */

const tableBody =
    document.getElementById(
        "tableBody"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const typeFilter =
    document.getElementById(
        "typeFilter"
    );

const subjectFilter =
    document.getElementById(
        "subjectFilter"
    );

const rollFilter =
    document.getElementById(
        "rollFilter"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


/* =========================================================
   LOAD FILTERS
========================================================= */

function loadRollFilter() {

    for (
        let i = 0;
        i < ROLLS.length;
        i++
    ) {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            ROLLS[i];

        option.textContent =
            ROLLS[i];

        rollFilter.appendChild(
            option
        );

    }

}


/* =========================================================
   LOAD SUBJECT FILTER
========================================================= */

function loadAllSubjects() {

    const allSubjects = [];

    const categories =
        Object.keys(SUBJECTS);

    for (
        let i = 0;
        i < categories.length;
        i++
    ) {

        const subjects =
            SUBJECTS[
                categories[i]
            ];

        for (
            let j = 0;
            j < subjects.length;
            j++
        ) {

            if (
                allSubjects.indexOf(
                    subjects[j]
                ) === -1
            ) {

                allSubjects.push(
                    subjects[j]
                );

            }

        }

    }


    for (
        let i = 0;
        i < allSubjects.length;
        i++
    ) {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            allSubjects[i];

        option.textContent =
            allSubjects[i];

        subjectFilter.appendChild(
            option
        );

    }

}


/* =========================================================
   TYPE → SUBJECT FILTER
========================================================= */

typeFilter.addEventListener(
    "change",
    function () {

        const selectedType =
            typeFilter.value;

        subjectFilter.innerHTML =
            '<option value="">All Subjects</option>';


        if (
            selectedType &&
            SUBJECTS[selectedType]
        ) {

            const subjects =
                SUBJECTS[selectedType];


            for (
                let i = 0;
                i < subjects.length;
                i++
            ) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    subjects[i];

                option.textContent =
                    subjects[i];

                subjectFilter.appendChild(
                    option
                );

            }

        } else {

            loadAllSubjects();

        }


        renderTable();

    }
);


/* =========================================================
   LOAD DATA
========================================================= */

async function loadPresentations() {

    tableBody.innerHTML = `

        <tr>

            <td colspan="5">

                <div class="message loading">
                    Loading presentations...
                </div>

            </td>

        </tr>

    `;


    try {

        /*
           IMPORTANT:

           This expects your server to provide:

           GET /api/submissions
        */

        const response =
            await fetch(
                "/api/submissions"
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
           Supports either:

           {
              submissions: [...]
           }

           OR

           {
              files: [...]
           }

           OR

           [...]
        */

        if (
            Array.isArray(data)
        ) {

            presentations =
                data;

        } else if (
            Array.isArray(
                data.submissions
            )
        ) {

            presentations =
                data.submissions;

        } else if (
            Array.isArray(
                data.files
            )
        ) {

            presentations =
                data.files;

        } else {

            presentations = [];

        }


        updateStatistics();

        renderTable();

    } catch (error) {

        console.error(error);

        tableBody.innerHTML = `

            <tr>

                <td colspan="5">

                    <div class="message error">

                        Unable to load presentations.

                        <br><br>

                        ${escapeHTML(error.message)}

                    </div>

                </td>

            </tr>

        `;

    }

}


/* =========================================================
   FILTER
========================================================= */

function getFilteredData() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const type =
        typeFilter.value;

    const subject =
        subjectFilter.value;

    const roll =
        rollFilter.value;


    return presentations.filter(
        function (item) {

            const itemRoll =
                String(
                    item.roll ||
                    item.rollNumber ||
                    ""
                );

            const itemSubject =
                String(
                    item.subject ||
                    ""
                );

            const itemType =
                String(
                    item.category ||
                    item.type ||
                    ""
                );

            const itemFile =
                String(
                    item.name ||
                    item.fileName ||
                    ""
                );


            if (
                search &&
                !(
                    itemRoll
                        .toLowerCase()
                        .includes(search)
                    ||
                    itemFile
                        .toLowerCase()
                        .includes(search)
                )
            ) {

                return false;

            }


            if (
                type &&
                itemType !== type
            ) {

                return false;

            }


            if (
                subject &&
                itemSubject !== subject
            ) {

                return false;

            }


            if (
                roll &&
                itemRoll !== roll
            ) {

                return false;

            }


            return true;

        }
    );

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

    const filtered =
        getFilteredData();


    document.getElementById(
        "resultCount"
    ).textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " result"
                : " results"
        );


    if (
        filtered.length === 0
    ) {

        tableBody.innerHTML = `

            <tr>

                <td colspan="5">

                    <div class="message">

                        No presentations found.

                    </div>

                </td>

            </tr>

        `;

        return;

    }


    let html = "";


    for (
        let i = 0;
        i < filtered.length;
        i++
    ) {

        const item =
            filtered[i];


        const roll =
            item.roll ||
            item.rollNumber ||
            "-";


        const type =
            item.category ||
            item.type ||
            "-";


        const subject =
            item.subject ||
            "-";


        const fileName =
            item.name ||
            item.fileName ||
            "Open file";


        const fileUrl =
            item.webViewLink ||
            item.url ||
            item.link ||
            "#";


        const date =
            item.createdTime ||
            item.date ||
            "";


        let formattedDate =
            "-";


        if (date) {

            const d =
                new Date(date);

            if (
                !isNaN(
                    d.getTime()
                )
            ) {

                formattedDate =
                    d.toLocaleString();

            }

        }


        let badgeClass =
            "badge-lab";


        if (
            type === "Theory"
        ) {

            badgeClass =
                "badge-theory";

        }


        if (
            type === "Project"
        ) {

            badgeClass =
                "badge-project";

        }


        html += `

            <tr>

                <td>
                    <strong>
                        ${escapeHTML(roll)}
                    </strong>
                </td>

                <td>

                    <span
                        class="badge ${badgeClass}"
                    >
                        ${escapeHTML(type)}
                    </span>

                </td>

                <td>
                    ${escapeHTML(subject)}
                </td>

                <td>

                    ${
                        fileUrl !== "#"

                        ?

                        `
                        <a
                            class="file-link"
                            href="${escapeAttribute(fileUrl)}"
                            target="_blank"
                            rel="noopener"
                        >
                            ${escapeHTML(fileName)}
                        </a>
                        `

                        :

                        escapeHTML(fileName)
                    }

                </td>

                <td>
                    ${escapeHTML(formattedDate)}
                </td>

            </tr>

        `;

    }


    tableBody.innerHTML =
        html;

}


/* =========================================================
   STATISTICS
========================================================= */

function updateStatistics() {

    let lab = 0;
    let theory = 0;
    let project = 0;


    for (
        let i = 0;
        i < presentations.length;
        i++
    ) {

        const type =
            String(
                presentations[i].category ||
                presentations[i].type ||
                ""
            );


        if (
            type === "Lab"
        ) {

            lab++;

        } else if (
            type === "Theory"
        ) {

            theory++;

        } else if (
            type === "Project"
        ) {

            project++;

        }

    }


    document.getElementById(
        "totalCount"
    ).textContent =
        presentations.length;


    document.getElementById(
        "labCount"
    ).textContent =
        lab;


    document.getElementById(
        "theoryCount"
    ).textContent =
        theory;


    document.getElementById(
        "projectCount"
    ).textContent =
        project;

}


/* =========================================================
   CLEAR FILTERS
========================================================= */

clearBtn.addEventListener(
    "click",
    function () {

        searchInput.value =
            "";

        typeFilter.value =
            "";

        rollFilter.value =
            "";

        subjectFilter.innerHTML =
            '<option value="">All Subjects</option>';

        loadAllSubjects();

        renderTable();

    }
);


/* =========================================================
   LIVE FILTERING
========================================================= */

searchInput.addEventListener(
    "input",
    renderTable
);


rollFilter.addEventListener(
    "change",
    renderTable
);


subjectFilter.addEventListener(
    "change",
    renderTable
);


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
    "click",
    function () {

        loadPresentations();

    }
);


/* =========================================================
   SECURITY HELPERS
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")

}
