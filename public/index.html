<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CSM PPT Submission</title>

    <script>
        const classCode = new URLSearchParams(location.search).get("class");
        location.replace(classCode
            ? `/student.html?class=${encodeURIComponent(classCode)}`
            : "/student.html?class=0ByADJgBHSrnWtxN");
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            font-size: 15px;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 0.2s;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .info {
            color: #2563eb;
        }

        .file-name {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>CSM PPT Submission</h1>

        <p class="subtitle">
            Upload your presentation directly to Google Drive
        </p>

        <!-- ROLL NUMBER -->

        <div class="form-group">

            <label for="roll">
                Roll Number
            </label>

            <select id="roll">

                <option value="">
                    Select Roll Number
                </option>

            </select>

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

            <label for="category">
                Presentation Type
            </label>

            <select id="category">

                <option value="">
                    Select Type
                </option>

                <option value="Lab">
                    Lab
                </option>

                <option value="Theory">
                    Theory
                </option>

                <option value="Project">
                    Project
                </option>

            </select>

        </div>


        <!-- SUBJECT -->

        <div class="form-group">

            <label for="subject">
                Subject
            </label>

            <select id="subject">

                <option value="">
                    Select Subject
                </option>

            </select>

        </div>


        <!-- FILE -->

        <div class="form-group">

            <label for="file">
                PPT / PPTX
            </label>

            <input
                type="file"
                id="file"
                accept=".ppt,.pptx"
            >

            <div
                class="file-name"
                id="fileName"
            ></div>

        </div>


        <!-- UPLOAD BUTTON -->

        <button
            id="uploadButton"
            type="button"
        >
            Upload PPT
        </button>


        <!-- PROGRESS -->

        <div
            class="progress-container"
            id="progressContainer"
        >

            <div class="progress-bar">

                <div
                    class="progress"
                    id="progress"
                ></div>

            </div>

        </div>


        <!-- STATUS -->

        <div id="status"></div>

    </div>

</div>


<script>

/* =========================================================
   ROLL NUMBERS
========================================================= */

const ROLLS = [

    "257R1A66C9",

    "257R1A66D0",
    "257R1A66D1",
    "257R1A66D2",
    "257R1A66D3",
    "257R1A66D4",
    "257R1A66D5",
    "257R1A66D6",
    "257R1A66D7",
    "257R1A66D8",
    "257R1A66D9",

    "257R1A66E0",
    "257R1A66E1",
    "257R1A66E2",
    "257R1A66E3",
    "257R1A66E4",
    "257R1A66E5",
    "257R1A66E6",
    "257R1A66E7",
    "257R1A66E8",
    "257R1A66E9",

    "257R1A66F0",
    "257R1A66F1",
    "257R1A66F2",
    "257R1A66F3",
    "257R1A66F4",
    "257R1A66F5",
    "257R1A66F6",
    "257R1A66F7",
    "257R1A66F8",
    "257R1A66F9",

    "257R1A66G0",
    "257R1A66G1",
    "257R1A66G2",
    "257R1A66G3",
    "257R1A66G4",
    "257R1A66G5",
    "257R1A66G6",
    "257R1A66G7",
    "257R1A66G8",
    "257R1A66G9",

    "257R1A66H0",
    "257R1A66H1",
    "257R1A66H2",
    "257R1A66H3",
    "257R1A66H4",
    "257R1A66H5",
    "257R1A66H6",
    "257R1A66H7",
    "257R1A66H8",
    "257R1A66H9",

    "257R1A66J0",
    "257R1A66J1",
    "257R1A66J3",
    "257R1A66J4",
    "257R1A66J6",
    "257R1A66J7",
    "257R1A66J8",
    "257R1A66J9",

    "257R1A66K0",
    "257R1A66K1",
    "257R1A66K2",

    "267R5A6615",
    "267R5A6616",
    "267R5A6617",
    "267R5A6618",
    "267R5A6619",
    "267R5A6620",
    "267R5A6621",
    "267R5A6622"

];


/* =========================================================
   SUBJECT STRUCTURE
========================================================= */

const STRUCTURE = {

    Lab: [
        "Node-JS",
        "CM",
        "JAVA",
        "DBMS",
        "SE",
        "GS"
    ],

    Theory: [
        "MSF",
        "JAVA",
        "COA",
        "DBMS",
        "SE"
    ],

    Project: [
        "Node-JS",
        "CM",
        "JAVA",
        "DBMS",
        "SE"
    ]

};


/* =========================================================
   ELEMENTS
========================================================= */

const rollSelect =
    document.getElementById("roll");

const categorySelect =
    document.getElementById("category");

const subjectSelect =
    document.getElementById("subject");

const fileInput =
    document.getElementById("file");

const uploadButton =
    document.getElementById("uploadButton");

const status =
    document.getElementById("status");

const progressContainer =
    document.getElementById(
        "progressContainer"
    );

const progress =
    document.getElementById(
        "progress"
    );

const fileName =
    document.getElementById(
        "fileName"
    );


/* =========================================================
   POPULATE ROLL NUMBERS
========================================================= */

function loadRollNumbers() {

    for (
        let i = 0;
        i < ROLLS.length;
        i++
    ) {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            ROLLS[i];

        option.textContent =
            ROLLS[i];

        rollSelect.appendChild(
            option
        );

    }

}


/* =========================================================
   CATEGORY → SUBJECTS
========================================================= */

categorySelect.addEventListener(
    "change",
    function () {

        subjectSelect.innerHTML =
            '<option value="">Select Subject</option>';

        const category =
            categorySelect.value;

        if (
            !category ||
            !STRUCTURE[category]
        ) {

            return;

        }

        const subjects =
            STRUCTURE[category];

        for (
            let i = 0;
            i < subjects.length;
            i++
        ) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                subjects[i];

            option.textContent =
                subjects[i];

            subjectSelect.appendChild(
                option
            );

        }

    }
);


/* =========================================================
   FILE NAME
========================================================= */

fileInput.addEventListener(
    "change",
    function () {

        if (
            fileInput.files.length > 0
        ) {

            fileName.textContent =
                "Selected: " +
                fileInput.files[0].name;

        } else {

            fileName.textContent =
                "";

        }

    }
);


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type
) {

    status.textContent =
        message;

    status.className =
        type || "";

}


/* =========================================================
   UPLOAD
========================================================= */

uploadButton.addEventListener(
    "click",
    function () {

        const roll =
            rollSelect.value;

        const category =
            categorySelect.value;

        const subject =
            subjectSelect.value;

        const file =
            fileInput.files[0];


        /* ---------------------------------------------
           VALIDATION
        --------------------------------------------- */

        if (!roll) {

            showStatus(
                "Please select your roll number.",
                "error"
            );

            return;

        }

        if (!category) {

            showStatus(
                "Please select presentation type.",
                "error"
            );

            return;

        }

        if (!subject) {

            showStatus(
                "Please select subject.",
                "error"
            );

            return;

        }

        if (!file) {

            showStatus(
                "Please select a PPT file.",
                "error"
            );

            return;

        }


        if (
            !/\.(ppt|pptx)$/i.test(
                file.name
            )
        ) {

            showStatus(
                "Only PPT and PPTX files are allowed.",
                "error"
            );

            return;

        }


        /* ---------------------------------------------
           PREPARE FORM DATA
        --------------------------------------------- */

        const formData =
            new FormData();

        formData.append(
            "roll",
            roll
        );

        formData.append(
            "category",
            category
        );

        formData.append(
            "subject",
            subject
        );

        /*
           IMPORTANT:

           We are sending the actual file.

           NO BASE64.
        */

        formData.append(
            "file",
            file
        );


        /* ---------------------------------------------
           UI
        --------------------------------------------- */

        uploadButton.disabled =
            true;

        progressContainer.style.display =
            "block";

        progress.style.width =
            "0%";

        showStatus(
            "Uploading PPT...",
            "info"
        );


        /* ---------------------------------------------
           XMLHttpRequest
           Used so we can show upload progress.
        --------------------------------------------- */

        const xhr =
            new XMLHttpRequest();


        xhr.open(
            "POST",
            "/api/upload",
            true
        );


        /* ---------------------------------------------
           UPLOAD PROGRESS
        --------------------------------------------- */

        xhr.upload.onprogress =
            function (event) {

                if (
                    event.lengthComputable
                ) {

                    const percent =
                        Math.round(
                            (
                                event.loaded /
                                event.total
                            ) * 100
                        );

                    progress.style.width =
                        percent + "%";

                    showStatus(
                        "Uploading... " +
                        percent +
                        "%",
                        "info"
                    );

                }

            };


        /* ---------------------------------------------
           RESPONSE
        --------------------------------------------- */

        xhr.onload =
            function () {

                uploadButton.disabled =
                    false;

                let response;

                try {

                    response =
                        JSON.parse(
                            xhr.responseText
                        );

                } catch (error) {

                    showStatus(
                        "Invalid server response.",
                        "error"
                    );

                    return;

                }


                if (
                    xhr.status >= 200 &&
                    xhr.status < 300 &&
                    response.ok
                ) {

                    progress.style.width =
                        "100%";

                    showStatus(
                        "PPT uploaded successfully!",
                        "success"
                    );


                    /*
                       Reset form
                    */

                    rollSelect.value =
                        "";

                    categorySelect.value =
                        "";

                    subjectSelect.innerHTML =
                        '<option value="">Select Subject</option>';

                    fileInput.value =
                        "";

                    fileName.textContent =
                        "";


                } else {

                    showStatus(
                        response.error ||
                        "Upload failed.",
                        "error"
                    );

                }

            };


        /* ---------------------------------------------
           NETWORK ERROR
        --------------------------------------------- */

        xhr.onerror =
            function () {

                uploadButton.disabled =
                    false;

                showStatus(
                    "Network error. Please try again.",
                    "error"
                );

            };


        /* ---------------------------------------------
           SEND
        --------------------------------------------- */

        xhr.send(
            formData
        );

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadRollNumbers();

</script>

</body>
</html>
