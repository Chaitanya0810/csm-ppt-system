<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSM PPT Submission</title>
  <script>
    const classCode = new URLSearchParams(location.search).get("class") || "0ByADJgBHSrnWtxN";
    fetch('/api/lecturer/me').then(r=>r.json()).then(me=>location.replace(me.signedIn?'/lecturer.html':`/student.html?class=${encodeURIComponent(classCode)}`)).catch(()=>location.replace(`/student.html?class=${encodeURIComponent(classCode)}`));
  </script>
</head>
<body>
  <p>Opening the student submission page… <a href="/student.html?class=0ByADJgBHSrnWtxN">Continue</a></p>
</body>
</html>
